<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  
  <!-- JavaScript files -->
  <script src="service.js" defer></script>
  <script src="../loadExtra.js" defer></script>
</head>
<body>
  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Main Content -->
  <div class="container py-5">
    <div class="card shadow p-4">
      <h1 class="mb-4 text-center">Generate Service Commands</h1>
      
      <div class="mb-3">
        <label for="inputTicket" class="form-label">Enter Ticket Description:</label>
        <textarea 
          class="form-control" 
          id="inputTicket" 
          name="inputTicket" 
          rows="5" 
          placeholder="Type the issue or request here..."></textarea>
      </div>

      <div class="d-grid mb-4">
        <button class="btn btn-primary" onclick="classify()">Generate Commands</button>
      </div>

      <div>
        <h5>Basic Command:</h5>
        <div id="basicCommand" class="alert alert-secondary" role="alert"></div>
      </div>

      <div>
        <h5>Command List:</h5>
        <div id="commandList" class="list-group"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
